name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
      - run: moon version --all
      - run: moon update
      - run: moon check --deny-warn
      - run: moon fmt --check
      - run: moon build

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [js, wasm-gc, native]
    steps:
      - uses: actions/checkout@v4
      - name: Install MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
      - run: moon update
      - run: moon test --target ${{ matrix.target }} --deny-warn

  fixtures:
    # The expected outputs must be reproducible from the pinned official packages.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
      - run: npm ci
        working-directory: scripts
      - run: node gen_fixtures.mjs
        working-directory: scripts
      - run: moon fmt
      - name: Regenerated fixtures must equal the committed ones
        run: git diff --exit-code -- src/internal src/text/font_faces_gen.mbt
